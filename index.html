<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive AI Delegation & Loop Engineering Assessment</title>
    <style>
        :root {
            --bg-base: #121013;
            --bg-card: #1c181e;
            --bg-card-hover: #262029;
            --accent-pink: #f4b4d6;
            --accent-pink-muted: #d88cb9;
            --accent-pink-glow: rgba(244, 180, 214, 0.25);
            --silver-light: #f3f3f5;
            --silver-mid: #c0c0c7;
            --silver-dark: #6e6e79;
            --border-silver: rgba(243, 243, 245, 0.15);
            --border-pink: rgba(244, 180, 214, 0.3);
            --correct-blue: #7dd3fc;
            --incorrect-red: #f87171;
            --font-sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--silver-light);
            font-family: var(--font-sans);
            line-height: 1.6;
            padding: 2rem 1rem;
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 2.5rem 1rem;
            border-bottom: 1px solid var(--border-pink);
            margin-bottom: 2rem;
            background: radial-gradient(circle at top, rgba(244, 180, 214, 0.08) 0%, transparent 70%);
            border-radius: 16px;
        }

        h1 {
            color: var(--accent-pink);
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-shadow: 0 0 20px var(--accent-pink-glow);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-style: italic;
            color: var(--silver-mid);
            font-size: 1rem;
            margin-bottom: 1.5rem;
        }

        /* Sticky Bar */
        .progress-container {
            position: sticky;
            top: 1rem;
            z-index: 100;
            background: var(--bg-card);
            border: 1px solid var(--border-silver);
            border-radius: 30px;
            padding: 0.75rem 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
        }

        .progress-bar-bg {
            flex-grow: 1;
            height: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 5px;
            margin: 0 1rem;
            overflow: hidden;
            border: 1px solid var(--border-silver);
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-pink-muted), var(--accent-pink));
            transition: width 0.3s ease;
            box-shadow: 0 0 10px var(--accent-pink);
        }

        .progress-text {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--silver-light);
            white-space: nowrap;
        }

        /* MCQ Card Styles */
        .mcq-card {
            background: var(--bg-card);
            border: 1px solid var(--border-silver);
            border-radius: 14px;
            padding: 1.75rem;
            margin-bottom: 1.5rem;
            transition: all 0.25s ease;
        }

        .mcq-card:hover {
            border-color: var(--border-pink);
        }

        .mcq-header {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            margin-bottom: 1.25rem;
        }

        .mcq-num {
            background: rgba(244, 180, 214, 0.1);
            color: var(--accent-pink);
            border: 1px solid var(--border-pink);
            font-family: var(--font-mono);
            font-size: 0.85rem;
            font-weight: 700;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            white-space: nowrap;
        }

        .mcq-question {
            color: var(--silver-light);
            font-size: 1.05rem;
            font-weight: 600;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.75rem;
        }

        /* Radio Buttons */
        .option-label {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-silver);
            border-radius: 8px;
            padding: 0.85rem 1.1rem;
            font-size: 0.95rem;
            color: var(--silver-mid);
            display: flex;
            align-items: center;
            gap: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-label:hover {
            background: rgba(244, 180, 214, 0.05);
            border-color: var(--border-pink);
            color: var(--silver-light);
        }

        .option-label input[type="radio"] {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid var(--silver-dark);
            border-radius: 50%;
            outline: none;
            transition: all 0.2s ease;
            position: relative;
            flex-shrink: 0;
            cursor: pointer;
        }

        .option-label input[type="radio"]:checked {
            border-color: var(--accent-pink);
            background-color: var(--accent-pink);
            box-shadow: 0 0 8px var(--accent-pink);
        }

        .option-label.selected {
            background: rgba(244, 180, 214, 0.08);
            border-color: var(--accent-pink);
            color: var(--silver-light);
        }

        /* Post-Submission Styles */
        .mcq-card.is-correct {
            border-color: rgba(125, 211, 252, 0.4) !important;
            background: rgba(125, 211, 252, 0.02);
        }

        .mcq-card.is-incorrect {
            border-color: rgba(248, 113, 113, 0.4) !important;
            background: rgba(248, 113, 113, 0.02);
        }

        .option-label.correct-target {
            border-color: #38bdf8 !important;
            background: rgba(56, 189, 248, 0.15) !important;
            color: #f0f9ff !important;
            font-weight: 600;
        }

        .option-label.wrong-target {
            border-color: #f87171 !important;
            background: rgba(248, 113, 113, 0.15) !important;
            color: #fef2f2 !important;
        }

        .explanation-box {
            display: none;
            margin-top: 1.25rem;
            padding: 1rem 1.25rem;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
            border-left: 4px solid var(--accent-pink);
            font-size: 0.92rem;
            color: var(--silver-mid);
            line-height: 1.5;
        }

        /* Controls */
        .controls {
            text-align: center;
            margin: 3rem 0;
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--accent-pink-muted), var(--accent-pink));
            color: #121013;
            font-family: var(--font-sans);
            font-weight: 700;
            font-size: 1.1rem;
            padding: 1rem 3rem;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 4px 20px var(--accent-pink-glow);
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(244, 180, 214, 0.4);
        }

        .btn-reset {
            background: transparent;
            color: var(--silver-mid);
            border: 1px solid var(--border-silver);
            padding: 0.75rem 2rem;
            border-radius: 30px;
            font-size: 0.95rem;
            cursor: pointer;
            margin-left: 1rem;
            transition: all 0.2s ease;
            display: none;
        }

        .btn-reset:hover {
            border-color: var(--accent-pink);
            color: var(--accent-pink);
        }

        /* Dynamic Score Board */
        #results-panel {
            display: none;
            background: var(--bg-card);
            border: 2px solid var(--border-pink);
            border-radius: 16px;
            padding: 2.5rem;
            margin-bottom: 3rem;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 6px solid var(--accent-pink);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 1.5rem auto;
            box-shadow: 0 0 25px var(--accent-pink-glow);
            background: rgba(244, 180, 214, 0.05);
        }

        .score-number {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--silver-light);
            font-family: var(--font-mono);
            line-height: 1;
        }

        .score-total {
            font-size: 0.9rem;
            color: var(--accent-pink);
            font-weight: 600;
        }

        .score-label {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent-pink);
            margin-bottom: 0.5rem;
        }

        .score-feedback {
            color: var(--silver-mid);
            font-size: 1rem;
            max-width: 600px;
            margin: 0 auto 1.5rem;
        }

        footer {
            text-align: center;
            padding: 2rem 0;
            color: var(--silver-dark);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-silver);
        }
    </style>
</head>
<body>

    <header>
        <h1>AI Delegation Framework Assessment</h1>
        <div class="subtitle">Interactive Core Concepts Evaluation with Dynamic Scoring</div>
    </header>

    <!-- Progress Bar -->
    <div class="progress-container">
        <span class="progress-text">Answered: <strong id="answered-count">0</strong>/30</span>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
        <span class="progress-text"><strong id="progress-percent">0%</strong></span>
    </div>

    <!-- Results Display -->
    <div id="results-panel">
        <div class="score-label" id="grade-title">Evaluation Complete</div>
        <div class="score-circle">
            <span class="score-number" id="final-score">0</span>
            <span class="score-total">/ 30</span>
        </div>
        <div class="score-feedback" id="grade-feedback">Your performance score and detailed feedback will appear here once submitted.</div>
    </div>

    <!-- Quiz Form -->
    <form id="quiz-form">
        <div id="questions-wrapper"></div>

        <div class="controls">
            <button type="button" class="btn-submit" id="submit-btn" onclick="calculateAndDisplayScore()">Calculate Score & View Results</button>
            <button type="button" class="btn-reset" id="reset-btn" onclick="resetQuiz()">Retake Assessment</button>
        </div>
    </form>

    <footer>
        <p>Advanced Assessment Framework | Pink & Silver Theme</p>
    </footer>

    <script>
        const quizData = [
            {
                q: "What fundamental operational shift distinguishes 'Giving AI a Job' from traditional 'Asking AI'?",
                options: [
                    "Relying on natural language queries rather than formal system code.",
                    "Transitioning human responsibility from task execution to output verification while defining an end result.",
                    "Transferring legal and operational accountability entirely to the automated language model.",
                    "Restricting the model to internal parametric memory to eliminate web search dependencies."
                ],
                correct: 1,
                exp: "Giving AI a job fundamentally shifts human effort from generating intermediate steps to defining the expected outcome and rigorously verifying the resulting deliverable[cite: 1]. Accountability stays with the human supervisor throughout[cite: 1]."
            },
            {
                q: "Why is providing a detailed step-by-step procedural recipe often considered sub-optimal in human-AI delegation loops?",
                options: [
                    "Language models lack the ability to follow sequential multi-step logic.",
                    "Procedural recipes artificially constrain execution to the human's bounded approach instead of defining target conditions.",
                    "Executing procedural instructions consumes more tokens than generating dynamic reasoning loops.",
                    "AI models automatically reject prompts that specify procedural mechanics."
                ],
                correct: 1,
                exp: "Prescribing strict step-by-step recipes limits execution to the user's manual approach. Delegating the outcome allows the system to determine optimal paths while leaving the human to evaluate results against defined acceptance criteria."
            },
            {
                q: "Which of the following contains the complete list of components required in a Delegation Brief?",
                options: [
                    "System Prompt, User Prompt, Context, Fine-Tuning Data, API Key, Model Identifier.",
                    "Outcome, Context, Constraints, Authority, Deliverable, Verification.",
                    "Objective, Inputs, Functions, Temperature, Top-P, Stop Sequences.",
                    "Task, Recipe, Search Parameters, Memory Horizon, Human Approval, Exit Code."
                ],
                correct: 1,
                exp: "A standard Delegation Brief comprises six foundational elements: Outcome, Context, Constraints, Authority, Deliverable, and Verification."
            },
            {
                q: "In the context of the Delegation Loop, what role does the 'Authority' parameter play in a brief?",
                options: [
                    "It designates which external APIs the language model is permitted to call during execution.",
                    "It establishes boundaries between decisions the AI can make independently versus actions requiring explicit human authorization.",
                    "It configures user access permissions and role-based access controls within the enterprise application.",
                    "It grants the LLM root permissions to execute shell commands without sandboxing."
                ],
                correct: 1,
                exp: "The Authority section specifies decision-making parameters. It delineates autonomous actions from those requiring explicit user approval before proceeding."
            },
            {
                q: "How does a 'Deliverable' differ from a standard 'Answer' in formal AI delegation?",
                options: [
                    "An answer is conversational text in chat, while a deliverable is a structured artifact formatted for immediate external utility.",
                    "An answer contains verified facts, whereas a deliverable consists exclusively of raw unverified data streams.",
                    "Answers are produced by large base models, while deliverables are built using fine-tuned micro-models.",
                    "Deliverables do not permit any internal structural formatting such as markdown tables or JSON objects."
                ],
                correct: 0,
                exp: "An answer provides conversational chat responses, whereas a deliverable yields a complete, structured artifact (such as a formal document or structured table) ready for external use."
            },
            {
                q: "Which step of the Delegation Loop requires the human supervisor to validate outputs prior to final adoption?",
                options: [
                    "Intervene",
                    "Observe",
                    "Verify",
                    "Delegate"
                ],
                correct: 2,
                exp: "The Delegation Loop consists of Define, Delegate, Observe, Intervene, Verify, and Accept[cite: 1]. The Verify step requires evaluating output against brief specifications prior to acceptance[cite: 1]."
            },
            {
                q: "When managing ground-truth constraints on private internal data, what instruction best prevents AI hallucination?",
                options: [
                    "\"Use web search to fill in missing details from the uploaded file.\"",
                    "\"Rely exclusively on the provided text, and explicitly mark missing data as 'not in source'.\"",
                    "\"Infer reasonable values for missing information based on parametric knowledge.\"",
                    "\"Synthesize external assumptions to present a complete document.\""
                ],
                correct: 1,
                exp: "Ground-truth prompts require restricting output to provided sources and instructing the model to mark missing items explicitly (e.g., 'not in source') to eliminate ungrounded synthesis."
            },
            {
                q: "What is the primary function of the 'Plan-First' protocol in delegation workflows?",
                options: [
                    "To generate an automatic system log for compliance reporting.",
                    "To force the AI to outline its proposed strategy and pause for human validation before execution.",
                    "To decrease initial response latency by pre-compiling tokens.",
                    "To automatically override model system boundaries during long-context processing."
                ],
                correct: 1,
                exp: "The Plan-First protocol requires the agent to present its proposed execution steps and wait for explicit human go-ahead before executing tasks."
            },
            {
                q: "In Project/Knowledge environment architectures, where should immutable operational rules be stored?",
                options: [
                    "Ephemeral context windows",
                    "Standing Instructions / System Custom Instructions",
                    "Uploaded temporary CSV files",
                    "Search index web parameters"
                ],
                correct: 1,
                exp: "In project settings, permanent rules belong in Standing Instructions, while static reference materials are stored as persistent Knowledge files."
            },
            {
                q: "Which intervention move is appropriate when an AI system is progressing logically but heading slightly off-course?",
                options: [
                    "Escalate Capability",
                    "Redirect Direction",
                    "Take Job Back",
                    "Re-prompt with entire brief from scratch"
                ],
                correct: 1,
                exp: "When execution drifts off-course without breaking ground rules, the targeted intervention move is 'Redirect Direction'."
            },
            {
                q: "What defines a highly portable Delegation Brief?",
                options: [
                    "It contains vendor-specific API metadata tailored to a single LLM infrastructure.",
                    "It defines objective job bounds clearly enough to run seamlessly across ChatGPT, Claude, or Gemini without modification.",
                    "It is written in binary code executable directly by edge processors.",
                    "It relies on proprietary user interface shortcuts specific to one platform UI."
                ],
                correct: 1,
                exp: "Portability means a brief focuses on fundamental task parameters rather than platform-specific UI controls, running across multiple LLMs without modification."
            },
            {
                q: "According to the Verification Opened framework, what are the four sequential steps of verifying AI output?",
                options: [
                    "Read, Edit, Publish, Archive",
                    "Identify, Trace, Challenge, Decide",
                    "Parse, Compile, Execute, Validate",
                    "Scan, Summarize, Restructure, Confirm"
                ],
                correct: 1,
                exp: "The Verification Opened framework follows four structured sub-steps: Identify, Trace, Challenge, and Decide."
            },
            {
                q: "What action should a user take when sensitive private data must be processed within a delegation run?",
                options: [
                    "Sanitize the payload by removing PII and execute within a temporary or incognito session.",
                    "Upload raw records to the shared global knowledge base for future retrieval.",
                    "Rely on standard model settings without adjusting data retention flags.",
                    "Append non-binding legal disclaimers at the bottom of the user prompt."
                ],
                correct: 0,
                exp: "Handling sensitive data requires sanitizing private identifiers and utilizing temporary or incognito sessions to prevent persistent indexing."
            },
            {
                q: "What occurs when an unverified assumption or hallucinated metric survives conversion from chat text into a final deliverable?",
                options: [
                    "It automatically triggers a model error flag upon export.",
                    "It becomes hard-coded risk within downstream business operations due to structural polish masking invalid data.",
                    "The platform cleans invalid claims automatically during table rendering.",
                    "Parametric memory auto-corrects the error upon downloading the file."
                ],
                correct: 1,
                exp: "Formatting errors or hallucinations into clean deliverables can create operational risks, as professional presentation often masks unverified underlying data."
            },
            {
                q: "In the context of delegation loops, what does the principle 'Humans define intent. Agents execute. Humans verify outcomes.' imply about legal liability?",
                options: [
                    "Responsibility transfers to the AI provider upon execution.",
                    "Ultimate accountability remains strictly with the human delegator regardless of agent autonomy.",
                    "Liability is split equally between the AI model developer and the user.",
                    "Agents assume liability if provided with a complete Delegation Brief."
                ],
                correct: 1,
                exp: "Automating execution does not transfer legal or operational liability; final oversight and decision-making remain with the human delegator[cite: 1]."
            },
            {
                q: "When should a supervisor trigger the 'Escalate Capability' intervention move?",
                options: [
                    "When the model makes a minor typographical error in formatting.",
                    "When task complexity exceeds the model's current reasoning capacity, requiring extended thinking modes or stronger models.",
                    "When the AI requests a clarification regarding constraints.",
                    "When web search returns too many relevant domain links."
                ],
                correct: 1,
                exp: "When a task exceeds base capacity, the 'Escalate Capability' move switches to advanced reasoning modes or stronger model architectures."
            },
            {
                q: "How should persistent 'Knowledge' files be used within project workspace environments?",
                options: [
                    "As temporary, single-use scratchpads cleared after every message.",
                    "As canonical source context that automatically informs all sequential runs within that container.",
                    "As dynamic execution scripts that override local model weights.",
                    "As secondary storage for user chat histories across all workspaces."
                ],
                correct: 1,
                exp: "Persistent Knowledge files act as primary context sources for all subsequent executions within a designated project workspace."
            },
            {
                q: "What is the risk of providing vague boundaries in the 'Constraints' field of a brief?",
                options: [
                    "The model will refuse to execute the request.",
                    "The AI may fill ambiguity with unwarranted assumptions, exceeding intended scope or budget.",
                    "Context windows will collapse automatically.",
                    "Execution speed will increase beyond verification limits."
                ],
                correct: 1,
                exp: "Vague constraints allow models to make arbitrary decisions, potentially violating operational limits, formatting needs, or privacy controls."
            },
            {
                q: "Why is checking live hyperlinked source dates an essential sub-step in web-enabled research runs?",
                options: [
                    "Citations generated by search tools may reference outdated or irrelevant domain mirrors despite apparent structure.",
                    "Web search engines automatically block URLs containing historical timestamps.",
                    "Link checking reduces token consumption on follow-up prompts.",
                    "Language models require live network pinging to validate local syntax."
                ],
                correct: 0,
                exp: "Validating web research requires verifying source dates, as search tools can surface outdated or hallucinated link previews."
            },
            {
                q: "What is the final phase of the Verification Opened protocol before adopting a deliverable?",
                options: [
                    "Trace",
                    "Challenge",
                    "Decide",
                    "Identify"
                ],
                correct: 2,
                exp: "The final phase of verification is 'Decide,' leading to Accept, Correct, Investigate, or Reject."
            },
            {
                q: "When an AI agent repeatedly fails to achieve an acceptable standard despite multiple targeted interventions, what is the correct protocol move?",
                options: [
                    "Re-run the exact same prompt indefinitely until output changes.",
                    "Take Job Back (reclaim human execution).",
                    "Lower verification standards to accept current outputs.",
                    "Remove constraints from the Delegation Brief."
                ],
                correct: 1,
                exp: "If model performance remains sub-standard after targeted interventions, the final recovery step is 'Take Job Back' for manual execution."
            },
            {
                q: "What purpose does a 'Delegation Record' serve in enterprise agent workflows?",
                options: [
                    "It functions as an audit trail documenting brief parameters, run logs, verification checks, and final human sign-off.",
                    "It dynamically adjusts model temperature during execution cycles.",
                    "It stores backup system prompts in case of platform downtime.",
                    "It provides automated billing tracking for API usage."
                ],
                correct: 0,
                exp: "A Delegation Record acts as an audit trail documenting the original brief, operational logs, verification steps, and final human approval."
            },
            {
                q: "How does setting explicit 'Authority' parameters prevent system drift?",
                options: [
                    "By restricting the LLM's vocabulary choices to formal language.",
                    "By preventing the model from autonomously making high-stakes assumptions outside its designated scope.",
                    "By automatically stopping output generation when response length exceeds 500 words.",
                    "By preventing network connections during local model inference."
                ],
                correct: 1,
                exp: "Explicit Authority parameters establish decision boundaries, preventing unauthorized actions during autonomous execution."
            },
            {
                q: "Why must 'Verification' criteria be defined *before* initiating the run rather than after reviewing outputs?",
                options: [
                    "Models require pre-defined validation criteria to allocate reasoning tokens.",
                    "Pre-defining criteria prevents human confirmation bias from rationalizing flawed AI outputs post-hoc.",
                    "Platform UI interfaces do not allow text entry after generation completes.",
                    "It enables automated compilation of web search queries."
                ],
                correct: 1,
                exp: "Defining verification standards prior to execution establishes objective evaluation criteria, preventing post-hoc rationalization of flawed outputs."
            },
            {
                q: "Which design pattern characterizes 'Need First, Then Tool' selection?",
                options: [
                    "Activating platform switches and tools only when dictated by specific job requirements within the brief.",
                    "Turning on all available plugins, web search, and code execution parameters by default.",
                    "Choosing the most expensive foundation model prior to analyzing task scope.",
                    "Building custom software wrappers before attempting direct context prompting."
                ],
                correct: 0,
                exp: "The 'Need First, Then Tool' methodology enables platform features (such as live search or code interpreters) only when explicitly required by task constraints."
            },
            {
                q: "In the context of delegation, what is 'Parametric Memory'?",
                options: [
                    "Live real-time data fetched via external browsing tools.",
                    "Internal knowledge baked directly into model weights during training, subject to knowledge cutoffs.",
                    "Temporary context stored within session memory buffers.",
                    "Documents stored within a persistent workspace folder."
                ],
                correct: 1,
                exp: "Parametric Memory refers to static internal knowledge trained into model weights, bound by training cutoffs."
            },
            {
                q: "What is the 'Challenge' step within the verification protocol designed to evaluate?",
                options: [
                    "Testing logical consistency, stress-testing edge cases, and looking for missing context or subtle hallucinations.",
                    "Checking if spelling and grammar match baseline rules.",
                    "Verifying that response latency met pre-set speed benchmarks.",
                    "Confirming that total output token counts match context limits."
                ],
                correct: 0,
                exp: "The Challenge stage stress-tests outputs for logical consistency, edge cases, missing context, and subtle hallucinations."
            },
            {
                q: "How should iterative lessons learned from model drift or errors be preserved for future tasks?",
                options: [
                    "Memorized by individual users for manual prompt tweaks.",
                    "Codified directly into standing instructions or updated Delegation Brief templates.",
                    "Maintained in temporary chat histories for auto-indexing.",
                    "Saved as raw code snippets within external developer logs."
                ],
                correct: 1,
                exp: "To prevent recurring errors, lessons learned during execution should be codified into project Standing Instructions or reusable brief templates."
            },
            {
                q: "Which scenario indicates a failure in setting proper 'Constraints'?",
                options: [
                    "The AI outputs a structured 3-column table as requested.",
                    "The AI uses paid external services or generates non-compliant format types not authorized for the task.",
                    "The AI pauses execution to present a step-by-step plan.",
                    "The AI marks missing variables as 'not in source'."
                ],
                correct: 1,
                exp: "Uncontrolled tool usage or unauthorized output formats indicate incomplete or poorly defined constraints within the initial brief."
            },
            {
                q: "What is the main advantage of managing AI workflows via systematic loops rather than unstructured conversations?",
                options: [
                    "It eliminates the need for human review before deployment.",
                    "It provides predictable, repeatable, and verifiable execution across diverse platforms and task types.",
                    "It reduces token usage across all API calls to absolute zero.",
                    "It guarantees 100% mathematical accuracy without external checks."
                ],
                correct: 1,
                exp: "Systematic delegation loops provide repeatable, verifiable, and reliable outputs across various platforms and operational contexts[cite: 1]."
            }
        ];

        const userAnswers = new Array(quizData.length).fill(null);

        // Render Radio Buttons dynamically
        function renderQuiz() {
            const container = document.getElementById('questions-wrapper');
            container.innerHTML = '';

            quizData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'mcq-card';
                card.id = `q-card-${index}`;

                let optionsHTML = '';
                item.options.forEach((opt, optIdx) => {
                    optionsHTML += `
                        <label class="option-label" id="opt-label-${index}-${optIdx}">
                            <input type="radio" name="question_${index}" value="${optIdx}" onchange="registerChoice(${index}, ${optIdx})">
                            <span><strong>${String.fromCharCode(65 + optIdx)}.</strong> ${opt}</span>
                        </label>
                    `;
                });

                card.innerHTML = `
                    <div class="mcq-header">
                        <span class="mcq-num">Q${(index + 1).toString().padStart(2, '0')}</span>
                        <div class="mcq-question">${item.q}</div>
                    </div>
                    <div class="options-grid">
                        ${optionsHTML}
                    </div>
                    <div class="explanation-box" id="exp-${index}">
                        <strong>Explanation:</strong> ${item.exp}
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function registerChoice(qIndex, optIndex) {
            userAnswers[qIndex] = optIndex;
            
            // Highlight selected radio parent label
            quizData[qIndex].options.forEach((_, idx) => {
                const lbl = document.getElementById(`opt-label-${qIndex}-${idx}`);
                if (idx === optIndex) {
                    lbl.classList.add('selected');
                } else {
                    lbl.classList.remove('selected');
                }
            });

            // Update Progress Bar
            const answered = userAnswers.filter(a => a !== null).length;
            const pct = Math.round((answered / quizData.length) * 100);

            document.getElementById('answered-count').innerText = answered;
            document.getElementById('progress-fill').style.width = `${pct}%`;
            document.getElementById('progress-percent').innerText = `${pct}%`;
        }

        // Calculate and Display Score
        function calculateAndDisplayScore() {
            const unasked = userAnswers.filter(a => a === null).length;
            if (unasked > 0) {
                if (!confirm(`You still have ${unasked} unanswered question(s). Calculate final score anyway?`)) {
                    return;
                }
            }

            let calculatedScore = 0;

            quizData.forEach((item, index) => {
                const card = document.getElementById(`q-card-${index}`);
                const expBox = document.getElementById(`exp-${index}`);
                const selected = userAnswers[index];

                // Disable Radio Inputs after submission
                const inputs = card.querySelectorAll('input[type="radio"]');
                inputs.forEach(input => input.disabled = true);

                // Show Explanation
                expBox.style.display = 'block';

                if (selected === item.correct) {
                    calculatedScore++;
                    card.classList.add('is-correct');
                    document.getElementById(`opt-label-${index}-${selected}`).classList.add('correct-target');
                } else {
                    card.classList.add('is-incorrect');
                    if (selected !== null) {
                        document.getElementById(`opt-label-${index}-${selected}`).classList.add('wrong-target');
                    }
                    // Highlight Correct Option
                    document.getElementById(`opt-label-${index}-${item.correct}`).classList.add('correct-target');
                }
            });

            // Display Results Display Section
            const panel = document.getElementById('results-panel');
            const scoreNum = document.getElementById('final-score');
            const gradeTitle = document.getElementById('grade-title');
            const gradeFeedback = document.getElementById('grade-feedback');

            panel.style.display = 'block';
            scoreNum.innerText = calculatedScore;

            const scorePercentage = (calculatedScore / quizData.length) * 100;

            if (scorePercentage >= 90) {
                gradeTitle.innerText = "Mastery Level Attained";
                gradeFeedback.innerText = "Outstanding! You have mastered the core concepts of AI delegation, loop engineering, and output verification.";
            } else if (scorePercentage >= 70) {
                gradeTitle.innerText = "Proficient Competency";
                gradeFeedback.innerText = "Solid job! You possess a strong understanding of agent delegation protocols. Review the highlighted answers to refine edge cases.";
            } else {
                gradeTitle.innerText = "Needs Concept Review";
                gradeFeedback.innerText = "Take time to review the detailed explanations provided under each question to solidify your loop engineering knowledge.";
            }

            // Smooth Scroll to Top Results
            panel.scrollIntoView({ behavior: 'smooth' });

            // Toggle Buttons
            document.getElementById('submit-btn').style.display = 'none';
            document.getElementById('reset-btn').style.display = 'inline-block';
        }

        function resetQuiz() {
            userAnswers.fill(null);
            document.getElementById('results-panel').style.display = 'none';
            document.getElementById('submit-btn').style.display = 'inline-block';
            document.getElementById('reset-btn').style.display = 'none';
            
            document.getElementById('answered-count').innerText = '0';
            document.getElementById('progress-fill').style.width = '0%';
            document.getElementById('progress-percent').innerText = '0%';

            renderQuiz();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Initialize Assessment
        window.onload = renderQuiz;
    </script>
</body>
</html>
